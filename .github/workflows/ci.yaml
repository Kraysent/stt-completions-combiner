name: "[python] CI"

on:
  push:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install deps
        run: make install-dev

      - name: Run checks
        run: make check

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker runtime
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: local/app:latest

      - name: Run image help
        run: docker run --rm --entrypoint "stt-completions-combiner" local/app:latest --help

      - name: Save image
        run: docker save local/app:latest -o image.tar

      - name: Upload image
        uses: actions/upload-artifact@v7
        with:
          name: docker-image
          path: image.tar
          retention-days: 1

  release:
    runs-on: ubuntu-latest
    needs: [tests, build]
    if: github.ref_name == github.event.repository.default_branch
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download image
        uses: actions/download-artifact@v8
        with:
          name: docker-image

      - name: Set up Docker runtime
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Load image
        run: docker load -i image.tar

      - name: Set image name
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Set short SHA
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Push image
        run: |
          
          docker tag local/app:latest ${{ env.IMAGE_NAME }}:${{ env.SHORT_SHA }}
          docker tag local/app:latest ${{ env.IMAGE_NAME }}:latest
          docker push ${{ env.IMAGE_NAME }}:${{ env.SHORT_SHA }}
          docker push ${{ env.IMAGE_NAME }}:latest
          
